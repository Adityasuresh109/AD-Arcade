<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AD Arcade - Legendary Edition</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  </style>
</head>
<body class="galaxy"> <!-- Default theme -->

  <!-- 🌌 Galaxy Background -->
  <canvas id="stars"></canvas>

  <!-- 🔐 Login + Settings -->
  <div id="loginScreen" class="panel">
    <h1>🎮 AD ARCADE</h1>
    <p>Enter your name and choose your journey</p>

    <label for="playerName">👤 Name:</label>
    <input type="text" id="playerName" placeholder="Enter your name" required />

    <label for="themeSelect">🎨 Theme:</label>
    <select id="themeSelect">
      <option value="galaxy" selected>🌌 Galaxy</option>
      <option value="neon">🧠 Neon Grid</option>
      <option value="ice">❄️ Ice Realm</option>
      <option value="inferno">🔥 Inferno</option>
    </select>

    <label for="levelSelect">🧱 Level:</label>
    <select id="levelSelect">
      <option value="easy" selected>Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>

    <button id="startGameBtn">🚀 Start Game</button>
    <button id="viewLeaderboardBtn">🏆 View Leaderboard</button>
  </div>

  <!-- 🏆 Leaderboard -->
  <div id="leaderboardPanel" class="panel hidden">
    <h2>🏆 Top 10 Legends</h2>
    <ul id="leaderboardList"></ul>
    <button id="closeLeaderboardBtn">❌ Close</button>
  </div>

  <!-- 🎮 Score & Game UI -->
  <h2 id="gameTitle" class="hidden">AD Arcade - DX-Ball Revival</h2>
  <div id="scoreboard" class="hidden">
    <strong><span id="currentPlayer">Player</span></strong> |
    Score: <span id="score">0</span> |
    Lives: <span id="lives">3</span> |
    High Score: <span id="highscore">0</span>
  </div>

  <!-- 🕹️ Game Canvas -->
  <canvas id="gameCanvas" width="800" height="600" class="hidden"></canvas>

  <!-- 📱 Mobile Controls -->
  <div class="mobile-controls hidden">
    <button id="leftBtn">◀️</button>
    <button id="rightBtn">▶️</button>
    <button id="enableTilt">📱 Enable Tilt</button>
  </div>

  <!-- 🎬 Intro Text -->
  <div id="introText">GET READY</div>

  <!-- 🧠 Game Engine -->
  <script src="script.js"></script>
</body>
</html>
